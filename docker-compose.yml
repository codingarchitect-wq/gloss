# Gloss on your own machine: the app and its Postgres, each in a container.
#
#   docker compose up -d --build      then open http://localhost:3100
#
# Your library is kept in Postgres, in the gloss-db volume, so it outlives restarts
# and rebuilds. Only `docker compose down -v` deletes it.
#
# There is one reader and no sign-in (NEXT_PUBLIC_GLOSS_LOCAL_USER), so both ports
# are bound to this machine only. Don't expose them to a network.

name: gloss

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gloss
      POSTGRES_PASSWORD: gloss
      POSTGRES_DB: gloss
    volumes:
      - gloss-db:/var/lib/postgresql/data
    ports:
      # For psql or a database app on the Mac. The app reaches it as db:5432.
      - "127.0.0.1:5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gloss -d gloss"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_GLOSS_LOCAL_USER: "1"
        NEXT_PUBLIC_SITE_URL: http://localhost:3100
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # Optional keys: OPENROUTER_API_KEY, EXA_API_KEY, LLAMA_CLOUD_API_KEY (see .env.example).
      # Anything database- or Clerk-related in it is overridden below or fixed at build time.
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://gloss:gloss@db:5432/gloss
      DATABASE_DRIVER: pg
      # Whole copies of the original pages, made with monolith, in the gloss-originals volume.
      GLOSS_ORIGINALS_DIR: /data/originals
    volumes:
      - gloss-originals:/data/originals
    ports:
      - "127.0.0.1:3100:3100"

volumes:
  gloss-db:
  gloss-originals:
